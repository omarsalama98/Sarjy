[project]
name = "sarjy-backend"
version = "0.1.0"
description = "Voice travel assistant that never states a travel fact it cannot source"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "groq>=0.13",
    "google-genai>=0.3",
    # The Deepgram TTS adapter opens a raw `websockets` connection, which
    # (unlike httpx, used by the Groq/Gemini adapters) does not fall back to
    # certifi automatically -- it trusts the OS/interpreter's own CA store.
    # A debian_slim container can lack one entirely (discovered running
    # tasks 6-8's smoke test: TTS failed SSL verification locally on a
    # python.org macOS build with the same root cause). Runtime dependency,
    # not dev-only -- modal_app.py's pip_install_from_pyproject only installs
    # this list, never the `dev` extra below.
    "certifi>=2024",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "modal>=1.5.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# This project is never `pip install`-ed into its own venv (no [build-system]
# here -- uv only resolves dependencies). Without this, pytest's default
# import mode adds tests/ to sys.path, not backend/, and `import app` in a
# test file fails. One line, versus adding packaging this project doesn't
# otherwise need.
pythonpath = ["."]
